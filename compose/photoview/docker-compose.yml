services:
  photoview:
    image: photoview/photoview:2
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - "${PHOTOVIEW_PORT:-8000}:80"
    environment:
      PHOTOVIEW_DATABASE_DRIVER: sqlite
      PHOTOVIEW_SQLITE_PATH: /home/photoview/database/photoview.db
      PHOTOVIEW_LISTEN_IP: 0.0.0.0
      PHOTOVIEW_LISTEN_PORT: 80
      PHOTOVIEW_MEDIA_CACHE: /home/photoview/media-cache
      # Uncomment to enable face detection / video thumbnails etc.
      # PHOTOVIEW_DISABLE_FACE_DETECTION: 1
      # PHOTOVIEW_DISABLE_RAW_PROCESSING: 1
    volumes:
      - ${PHOTOVIEW_DB_DIR:-./database}:/home/photoview/database
      - ${PHOTOVIEW_CACHE_DIR:-./cache}:/home/photoview/media-cache
      # Read-only photo library; add more mounts as needed, then add the
      # in-container path (/photos) as the root path for a user in the UI.
      - ${PHOTOS_DIR:-/mnt/photos}:/photos:ro
